model:
  name: zai-org/glm-4-voice-9b
  quantization: int4
  device: cuda:0
  max_new_tokens: 96
  temperature: 0.2
  top_p: 0.8
  audio_vocab_size: 16384

experiment:
  split: train
  scenarios: 20
  seeds: [0, 1, 2, 3, 4, 5]
  styles:
    - neutral
    - calm and confident
    - firm and assertive
    - empathetic and warm
    - urgent but controlled
    - hesitant and uncertain
  horizon: 4
  terminal_max_horizon: 8
  terminal_scenarios: [0, 4, 8, 12, 16]
  base_seed: 4242424242
  matched_transcript_min_rate: 0.80
  parseable_move_min_rate: 0.90
  strategically_valid_move_min_rate: 0.90
  terminal_subset_min_completion_rate: 0.80

resources:
  generation_batch_size: 1
  waveform_roundtrip: false
  context_cap_tokens: 2048

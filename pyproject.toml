[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-negotiation-kv"
version = "0.2.0"
description = "ParaGeo: compositional paralinguistic geometry for controllable speech language models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
glm = [
  "torch>=2.1",
  "transformers==4.44.1",
  "accelerate==0.34.2",
  "bitsandbytes>=0.43",
  "tiktoken>=0.7",
]
parageo = [
  "torch==2.3.0",
  "torchaudio==2.3.0",
  "transformers==4.44.1",
  "hyperpyyaml>=1.2.2",
  "omegaconf==2.3.0",
  "scipy>=1.10",
  "einops>=0.7",
  "diffusers==0.27.2",
  "conformer==0.3.2",
  "huggingface-hub==0.25.2",
  "hydra-core==1.3.2",
  "lightning==2.2.4",
  "rich==13.7.1",
  "gdown==5.1.0",
  "matplotlib==3.7.5",
  "wget==3.2",
  "setuptools<81",
  "soundfile==0.12.1",
  "google-genai==1.49.0",
  "edge-tts==7.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
